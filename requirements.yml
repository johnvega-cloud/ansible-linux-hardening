---
# Ansible collections. Install with: ansible-galaxy collection install -r requirements.yml
collections:
  - name: community.general
    version: ">=10.0.0"
  - name: amazon.aws          # EC2 dynamic inventory
    version: ">=9.0.0"
  - name: community.docker    # Molecule test driver
    version: ">=4.0.0"
  - name: ansible.posix       # used by the Molecule docker driver (synchronize)
    version: ">=1.6.0"
