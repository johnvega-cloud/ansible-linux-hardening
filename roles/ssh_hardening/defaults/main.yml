---
# --- Authentication ---
ssh_permit_root_login: "no"
ssh_password_authentication: false
ssh_pubkey_authentication: true
ssh_max_auth_tries: 4
ssh_login_grace_time: 60
# Restrict logins to these groups (empty = no restriction). Example: ["ssh-users", "admins"]
ssh_allow_groups: []

# --- Session limits ---
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 3
ssh_max_sessions: 10
ssh_max_startups: "10:30:60"

# --- Features that widen the attack surface ---
ssh_x11_forwarding: false
ssh_allow_tcp_forwarding: false
ssh_allow_agent_forwarding: false
ssh_log_level: VERBOSE   # logs key fingerprints used to log in

# --- Cryptography: only AEAD/CTR ciphers, ETM/SHA-2 MACs, curve25519/DH-16+ KEX ---
# Every algorithm below exists in OpenSSH 8.0 (RHEL 8), the oldest supported version.
ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
ssh_kex_algorithms:
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - diffie-hellman-group-exchange-sha256

# RHEL 8 passes the system crypto policy to sshd as command-line options, which
# override sshd_config. Clearing it lets the lists above take effect.
# Set to false to keep RHEL's crypto-policies in charge (e.g. FIPS hosts).
ssh_override_rhel8_crypto_policy: true

# --- Banner ---
ssh_banner_text: |
  Authorized access only. All activity is logged and monitored.

# --- Safety ---
# Before disabling passwords, check that the connecting user has an authorized key.
ssh_lockout_guard: true
