---
- name: SSH | Load OS family variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: [always]

# --- Safety first: never disable passwords for a user who has no key ---
- name: SSH | Lockout guard
  when:
    - ssh_lockout_guard | bool
    - not (ssh_password_authentication | bool)
    - ansible_connection | default('ssh') in ['ssh', 'smart', 'paramiko']
  block:
    - name: SSH | Look up the connecting user's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user | default(lookup('ansible.builtin.env', 'USER')) }}"

    - name: SSH | Check the connecting user's authorized_keys
      ansible.builtin.stat:
        path: "{{ getent_passwd[ansible_user | default(lookup('ansible.builtin.env', 'USER'))][4] }}/.ssh/authorized_keys"
      register: ssh_authorized_keys

    - name: SSH | Refuse to disable password login without an authorized key
      ansible.builtin.assert:
        that:
          - ssh_authorized_keys.stat.exists
          - ssh_authorized_keys.stat.size > 0
        fail_msg: >-
          The connecting user has no authorized_keys. Disabling password login would
          lock you out. Add a key first, or set ssh_lockout_guard=false if access is via SSM.
        quiet: true

- name: SSH | Install OpenSSH server
  ansible.builtin.package:
    name: "{{ ssh_packages }}"
    state: present

# RHEL 8's default sshd_config has no Include line; Ubuntu 22.04+ and RHEL 9 already do.
- name: SSH | Ensure drop-in directory exists
  ansible.builtin.file:
    path: "{{ ssh_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: SSH | Ensure sshd_config includes the drop-in directory first
  ansible.builtin.lineinfile:
    path: "{{ ssh_config_file }}"
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: "Include {{ ssh_dropin_dir }}/*.conf"
    insertbefore: BOF
    owner: root
    group: root
    mode: "0600"
    validate: "{{ ssh_sshd_binary }} -t -f %s"
  notify: Reload sshd

- name: SSH | Restrict sshd_config permissions
  ansible.builtin.file:
    path: "{{ ssh_config_file }}"
    owner: root
    group: root
    mode: "0600"

- name: SSH | Login banner
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "{{ ssh_banner_text }}"
    owner: root
    group: root
    mode: "0644"

# Ubuntu needs the privilege separation dir for `sshd -t` even while ssh.socket
# (24.04 socket activation) has not started the daemon yet.
- name: SSH | Ensure privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts['os_family'] == 'Debian'

- name: SSH | Let sshd_config choose ciphers on RHEL 8 (clear CRYPTO_POLICY)
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/sshd
    regexp: '^#?\s*CRYPTO_POLICY='
    line: "CRYPTO_POLICY="
    create: true
    owner: root
    group: root
    mode: "0640"
  when:
    - ssh_override_rhel8_crypto_policy | bool
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution_major_version'] == '8'
  notify: Restart sshd

# Write the drop-in, then validate the FULL config (main file + every drop-in).
# If validation fails, put the previous file back so a later reboot cannot
# start sshd with a broken config.
- name: SSH | Apply hardened drop-in (validated, rolled back on failure)
  block:
    - name: SSH | Template hardened drop-in
      ansible.builtin.template:
        src: 00-hardening.conf.j2
        dest: "{{ ssh_dropin_file }}"
        owner: root
        group: root
        mode: "0600"
        backup: true
      register: ssh_dropin
      notify: Reload sshd

    - name: SSH | Validate the complete sshd configuration
      ansible.builtin.command: "{{ ssh_sshd_binary }} -t"
      changed_when: false

  rescue:
    - name: SSH | Restore previous drop-in
      ansible.builtin.copy:
        src: "{{ ssh_dropin.backup_file }}"
        dest: "{{ ssh_dropin_file }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: ssh_dropin.backup_file is defined

    - name: SSH | Remove new drop-in that had no previous version
      ansible.builtin.file:
        path: "{{ ssh_dropin_file }}"
        state: absent
      when: ssh_dropin.backup_file is not defined

    - name: SSH | Stop this host
      ansible.builtin.fail:
        msg: "sshd -t rejected the hardened config; previous config restored, sshd not reloaded."

- name: SSH | Ensure sshd is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ ssh_activation_unit }}"
    state: started
    enabled: true
