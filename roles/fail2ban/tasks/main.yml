---
- name: Fail2ban | Load OS family variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: [always]

- name: Fail2ban | Enable EPEL
  ansible.builtin.include_tasks: RedHat.yml
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - fail2ban_manage_epel | bool

# In --check mode EPEL is not really added, so its packages cannot be resolved yet.
- name: Fail2ban | Install packages
  ansible.builtin.package:
    name: "{{ fail2ban_packages }}"
    state: present
  register: fail2ban_install
  when: not (ansible_check_mode and (fail2ban_epel_rhel | default({}) is changed or fail2ban_epel_el | default({}) is changed))

# In --check (audit) mode, skip configuration of packages that would be installed first.
- name: Fail2ban | Configure and start fail2ban
  ansible.builtin.include_tasks: configure.yml
  when: not (ansible_check_mode and (fail2ban_install is changed or fail2ban_install is skipped))
