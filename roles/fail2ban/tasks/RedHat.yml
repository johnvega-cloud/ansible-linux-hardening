---
# RHEL: EPEL comes from the Fedora project URL, signed with its GPG key.
# Rocky / AlmaLinux: epel-release is in their own "extras" repo.
- name: Fail2ban | Import EPEL GPG key (RHEL)
  ansible.builtin.rpm_key:
    key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}"
    state: present
  when: ansible_facts['distribution'] == 'RedHat'

- name: Fail2ban | Install EPEL release package (RHEL)
  ansible.builtin.dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: present
  register: fail2ban_epel_rhel
  when: ansible_facts['distribution'] == 'RedHat'

- name: Fail2ban | Install EPEL release package (Rocky / AlmaLinux)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  register: fail2ban_epel_el
  when: ansible_facts['distribution'] != 'RedHat'
