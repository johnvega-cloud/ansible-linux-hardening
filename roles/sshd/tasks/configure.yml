---
# Fresh images (and some golden-AMI pipelines) only create host keys on the first
# sshd start; `sshd -t` refuses to validate without them.
- name: SSH | Ensure host keys exist
  ansible.builtin.command: ssh-keygen -A
  args:
    creates: /etc/ssh/ssh_host_ed25519_key

# Ubuntu 22.04+ and RHEL 9 ship an Include line already; custom images may not.
- name: SSH | Ensure drop-in directory exists
  ansible.builtin.file:
    path: "{{ sshd_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: SSH | Ensure sshd_config includes the drop-in directory first
  ansible.builtin.lineinfile:
    path: "{{ sshd_config_file }}"
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: "Include {{ sshd_dropin_dir }}/*.conf"
    insertbefore: BOF
    owner: root
    group: root
    mode: "0600"
    validate: "{{ sshd_sshd_binary }} -t -f %s"
  notify: Reload sshd

- name: SSH | Restrict sshd_config permissions
  ansible.builtin.file:
    path: "{{ sshd_config_file }}"
    owner: root
    group: root
    mode: "0600"

- name: SSH | Login banner
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "{{ sshd_banner_text }}"
    owner: root
    group: root
    mode: "0644"

# Ubuntu needs the privilege separation dir for `sshd -t` even while ssh.socket
# (24.04 socket activation) has not started the daemon yet.
- name: SSH | Ensure privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts['os_family'] == 'Debian'

# Write the drop-in, then validate the FULL config (main file + every drop-in).
# If validation fails, undo only what this run changed, so a later reboot cannot
# start sshd with a broken config. An unchanged drop-in is never removed: the
# error is elsewhere, and deleting it would re-enable password logins.
- name: SSH | Apply hardened drop-in (validated, rolled back on failure)
  block:
    - name: SSH | Template hardened drop-in
      ansible.builtin.template:
        src: 00-hardening.conf.j2
        dest: "{{ sshd_dropin_file }}"
        owner: root
        group: root
        mode: "0600"
        backup: true
      register: sshd_dropin
      notify: Reload sshd

    - name: SSH | Validate the complete sshd configuration
      ansible.builtin.command: "{{ sshd_sshd_binary }} -t"
      changed_when: false

  rescue:
    - name: SSH | Restore previous drop-in
      ansible.builtin.copy:
        src: "{{ sshd_dropin.backup_file }}"
        dest: "{{ sshd_dropin_file }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - sshd_dropin is changed
        - sshd_dropin.backup_file is defined

    - name: SSH | Remove new drop-in that had no previous version
      ansible.builtin.file:
        path: "{{ sshd_dropin_file }}"
        state: absent
      when:
        - sshd_dropin is changed
        - sshd_dropin.backup_file is not defined

    - name: SSH | Stop this host
      ansible.builtin.fail:
        msg: >-
          sshd -t rejected the configuration. {{ 'The previous drop-in was restored.'
          if sshd_dropin is changed else 'The hardening drop-in was unchanged, so the
          problem is in another sshd file.' }} sshd was not reloaded.

- name: SSH | Ensure sshd is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ sshd_activation_unit }}"
    state: started
    enabled: true
