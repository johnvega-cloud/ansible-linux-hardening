---
- name: SSH | Load OS family variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: [always]

# --- Safety first: never disable passwords for a user who has no key ---
- name: SSH | Lockout guard
  when:
    - sshd_lockout_guard | bool
    - not (sshd_password_authentication | bool)
    - ansible_connection | default('ssh') in ['ssh', 'smart', 'paramiko']
  block:
    - name: SSH | Look up the connecting user's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ ansible_user | default(lookup('ansible.builtin.env', 'USER')) }}"

    - name: SSH | Check the connecting user's authorized_keys
      ansible.builtin.stat:
        path: "{{ getent_passwd[ansible_user | default(lookup('ansible.builtin.env', 'USER'))][4] }}/.ssh/authorized_keys"
      register: sshd_authorized_keys

    - name: SSH | Refuse to disable password login without an authorized key
      ansible.builtin.assert:
        that:
          - sshd_authorized_keys.stat.exists
          - sshd_authorized_keys.stat.size > 0
        fail_msg: >-
          The connecting user has no authorized_keys. Disabling password login would
          lock you out. Add a key first, or set sshd_lockout_guard=false if access is via SSM.
        quiet: true

- name: SSH | Install OpenSSH server
  ansible.builtin.package:
    name: "{{ sshd_packages }}"
    state: present
  register: sshd_install

# In --check (audit) mode a package that is not installed yet cannot be
# configured or started: report the install and skip the rest for this host.
- name: SSH | Configure sshd
  ansible.builtin.include_tasks: configure.yml
  when: not (ansible_check_mode and sshd_install is changed)
