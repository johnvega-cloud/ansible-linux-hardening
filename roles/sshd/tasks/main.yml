---
- name: SSH | Load OS family variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: [always]

# --- Safety first: the new config must still let the connecting user in ---
- name: SSH | Lockout guard
  ansible.builtin.include_tasks: guard.yml
  when:
    - sshd_lockout_guard | bool
    - ansible_connection | default('ssh') in sshd_lockout_guard_connections

- name: SSH | Install OpenSSH server
  ansible.builtin.package:
    name: "{{ sshd_packages }}"
    state: present
  register: sshd_install

# In --check (audit) mode a package that is not installed yet cannot be
# configured or started: report the install and skip the rest for this host.
- name: SSH | Configure sshd
  ansible.builtin.include_tasks: configure.yml
  when: not (ansible_check_mode and sshd_install is changed)
