---
# --- Authentication ---
sshd_permit_root_login: "no"
sshd_password_authentication: false
sshd_pubkey_authentication: true
sshd_max_auth_tries: 4
sshd_login_grace_time: 60
# Restrict logins to these groups (empty = no restriction). Example: ["ssh-users", "admins"]
sshd_allow_groups: []

# --- Session limits ---
sshd_client_alive_interval: 300
sshd_client_alive_count_max: 3
sshd_max_sessions: 10
sshd_max_startups: "10:30:60"

# --- Features that widen the attack surface ---
sshd_x11_forwarding: false
sshd_allow_tcp_forwarding: false
sshd_allow_agent_forwarding: false
sshd_log_level: VERBOSE   # logs key fingerprints used to log in

# --- Cryptography: only AEAD/CTR ciphers, ETM/SHA-2 MACs, curve25519/DH-16+ KEX ---
# Every algorithm below exists in OpenSSH 8.7 (RHEL 9), the oldest supported version.
sshd_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
sshd_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
sshd_kex_algorithms:
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - diffie-hellman-group-exchange-sha256

# --- Banner ---
sshd_banner_text: |
  Authorized access only. All activity is logged and monitored.

# systemd unit that starts sshd. Defaults per OS (vars/*.yml); override it on
# Ubuntu 24.04 hosts where ssh.socket was replaced by ssh.service.
sshd_activation_unit: "{{ sshd_os_activation_unit }}"

# --- Safety ---
# Before changing anything, check that the user Ansible logs in as can still log
# in afterwards: not root, has an authorized key, is in sshd_allow_groups.
sshd_lockout_guard: true
sshd_login_user: "{{ ansible_user | default(lookup('ansible.builtin.env', 'USER')) }}"
# Connection types that log in through sshd (the guard is pointless for others).
sshd_lockout_guard_connections: [ssh, smart, paramiko]
