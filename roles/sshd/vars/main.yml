---
sshd_sshd_binary: /usr/sbin/sshd
sshd_config_file: /etc/ssh/sshd_config
sshd_dropin_dir: /etc/ssh/sshd_config.d
# "00-" so it is read first: for most sshd options the FIRST value wins, so this
# file beats distro and cloud-init drop-ins (e.g. 50-cloud-init.conf enabling passwords).
sshd_dropin_file: /etc/ssh/sshd_config.d/00-hardening.conf
