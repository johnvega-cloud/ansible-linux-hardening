---
- name: Updates | Install dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
  register: auto_updates_install

# In --check (audit) mode, skip configuration of a package that would be installed first.
- name: Updates | Configure dnf-automatic
  ansible.builtin.include_tasks: RedHat_configure.yml
  when: not (ansible_check_mode and auto_updates_install is changed)
