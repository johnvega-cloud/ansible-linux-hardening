---
- name: Updates | Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  register: auto_updates_install

# In --check (audit) mode, skip configuration of a package that would be installed first.
- name: Updates | Configure unattended-upgrades
  ansible.builtin.include_tasks: Debian_configure.yml
  when: not (ansible_check_mode and auto_updates_install is changed)
